[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-ops-desk-backend"
version = "0.1.0"
description = "Tenant-scoped exception workflow API for CommerceOps Desk"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.1.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "container: requires Docker and a live PostgreSQL service",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.setuptools.packages.find]
include = ["app*"]
