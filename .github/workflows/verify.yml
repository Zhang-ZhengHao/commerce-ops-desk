name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i03-order-case-workflow:
    name: Order and case workflow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reuse runner dependency caches
        run: |
          echo "PIP_CACHE_DIR=$(python -m pip cache dir)" >> "$GITHUB_ENV"
          echo "npm_config_cache=$(npm config get cache)" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: COMMERCE_OPS_SETUP_BROWSER=0 make setup

      - name: Install Chromium and Linux dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: make build

      - name: Backend tests
        run: make backend-test

      - name: Project contract tests
        run: make project-test

      - name: Verified workstation image builder tests
        run: .venv/bin/python -m pytest -q scripts/tests/test_verified_image_build.py

      - name: Validate workstation Compose and Caddy 2.6.2 syntax
        env:
          SOURCE_SHA: 0123456789abcdef0123456789abcdef01234567
          HOST_PORT: "18088"
          DATA_DIR: /var/tmp/commerce-ops-candidate-ci
          TRUSTED_PROXY_CIDRS_JSON: '["127.0.0.1/32"]'
        run: |
          docker compose -f deploy/workstation/compose.yaml config --quiet
          for caddy_template in \
            deploy/workstation/commerce-ops-desk.Caddyfile.template \
            deploy/workstation/commerce-ops-desk.v0.2.0.Caddyfile.template
          do
            sed 's/{{UPSTREAM_PORT}}/18088/g' "$caddy_template" |
              docker run --rm --interactive --network none --entrypoint caddy caddy:2.6.2-alpine@sha256:7992b931b7da3cf0840dd69ea74b2c67d423faf03408da8abdc31b7590a239a7 adapt --adapter caddyfile --config /dev/stdin
          done

      - name: SQLite migration proof
        run: make sqlite-migrate-test

      - name: Frontend component tests
        run: make frontend-test

      - name: Hosted smoke
        run: make hosted-smoke

      - name: Browser smoke
        run: make e2e-smoke

      - name: Public history scan
        run: make public-scan

      - name: Static verification
        run: make lint

      - name: Preserve Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  postgres-integration:
    name: PostgreSQL 17 and production container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMMERCE_OPS_CONTAINER_IMAGE: commerce-ops-desk:postgres-ci
      COMMERCE_OPS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: commerce_ops_ci
          POSTGRES_PASSWORD: ci_only_postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U commerce_ops_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 10s
          --health-retries 20
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Reuse runner pip cache
        run: echo "PIP_CACHE_DIR=$(python -m pip cache dir)" >> "$GITHUB_ENV"

      - name: Install locked Python dependencies
        env:
          COMMERCE_OPS_SETUP_FRONTEND: "0"
          COMMERCE_OPS_SETUP_BROWSER: "0"
        run: make setup

      - name: Prove PostgreSQL migrations and runtime behavior
        env:
          COMMERCE_OPS_POSTGRES_TEST_ADMIN_URL: "postgresql+psycopg://commerce_ops_ci:ci_only_postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres"
        run: make postgres-test

      - name: Build production image
        run: docker build --build-arg "SOURCE_SHA=$COMMERCE_OPS_SOURCE_SHA" --file Dockerfile --tag "$COMMERCE_OPS_CONTAINER_IMAGE" .

      - name: Prove hardened production container
        env:
          COMMERCE_OPS_POSTGRES_TEST_ADMIN_URL: "postgresql+psycopg://commerce_ops_ci:ci_only_postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres"
        run: make postgres-container-test
