name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i02-demo-identity:
    name: Demo identity and access boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reuse runner dependency caches
        run: |
          echo "PIP_CACHE_DIR=$(python -m pip cache dir)" >> "$GITHUB_ENV"
          echo "npm_config_cache=$(npm config get cache)" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: COMMERCE_OPS_SETUP_BROWSER=0 make setup

      - name: Install Chromium and Linux dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: make build

      - name: Backend tests
        run: make backend-test

      - name: Project contract tests
        run: make project-test

      - name: SQLite migration proof
        run: make sqlite-migrate-test

      - name: Frontend component tests
        run: make frontend-test

      - name: Hosted smoke
        run: make hosted-smoke

      - name: Browser smoke
        run: make e2e-smoke

      - name: Public history scan
        run: make public-scan

      - name: Static verification
        run: make lint

      - name: Preserve Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
